name: Bug report
description: Report a bug or regression in @your-repo
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the bug
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI / command-line behavior
        - Project scaffolding / init flow
        - Templates / generated output
        - Build / packaging / release
        - Documentation
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Runtime / toolchain:
        - Version or command used:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / panic output
      description: Paste relevant terminal output, build errors, backtraces, or generated files if helpful.
      render: shell

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Low — minor inconvenience or cosmetic issue"
        - "Medium — affects a command or workflow but has a workaround"
        - "High — breaks core functionality or main user flow"
        - "Critical — prevents installation, build, or basic usage"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      value: |
        - [ ] The issue is reproducible and understood
        - [ ] The fix preserves the expected CLI behavior
        - [ ] Relevant tests or docs are updated if needed