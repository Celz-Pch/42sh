name: Release Stable

on:
  workflow_run:
    workflows: ["template - CI"]
    types: [completed]
    branches: [stable]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    container:
      image: lukassgx/epi-docker:tek1-extended

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: write
      pull-requests: write
      id-token: write
      issues: write

    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          target-branch: stable
          config-file: release-config.json
          manifest-file: .release-manifest.json

      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          fetch-depth: 0
          ref: stable

      - name: Build
        if: ${{ steps.release.outputs.release_created }}
        run: |
          make

      - name: Upload to GitHub Release
        if: ${{ steps.release.outputs.release_created }}
        env:
            GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ steps.release.outputs.tag_name }} 42sh